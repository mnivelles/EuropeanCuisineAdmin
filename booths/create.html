<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/styles/icons.css" />
    <link rel="stylesheet" href="/styles/app.css" />
    <link rel="stylesheet" href="/styles/form.css" />
    <title>Create Booth | Admin - Escale Europe</title>
  </head>
  <body>
    <div class="page bulma-container bulma-is-widescreen">
      <div class="page_header">
        <div class="siteName">
          <span class="es-icon es-icon-branch"></span>
          <div class="label">Escale Europe</div>
        </div>

        <nav id="mainNavBar"></nav>

        <button
          class="userMenu"
          type="button"
          popovertarget="userSettingsModal"
        >
          <img
            class="userMenu_photo"
            src="https://picsum.photos/seed/neko-mimi/600/300"
            alt="User Picture"
          />
          <span class="userMenu_indicator es-icon es-icon-chevron-down"></span>
        </button>

        <dialog
          id="userSettingsModal"
          class="userSettingsModal"
          closedby="any"
          popover
        >
          <div class="userSettingsModal_row nameEmail">
            <div class="name">Felipe Lebsack</div>
            <div class="email">felipe@lebsack.me</div>
          </div>
          <div class="userSettingsModal_divider"></div>
          <div class="userSettingsModal_row theme">
            <div class="label">Thème</div>
            <div class="content">Light</div>
          </div>
          <div class="userSettingsModal_divider"></div>
          <div class="userSettingsModal_row logOut">
            <span class="es-icon es-icon-log-out"></span>
            <span class="label">Log out</span>
          </div>
        </dialog>
      </div>

      <div class="page_island">
        <div class="island_header">
          <div class="breadcrumb">
            <div class="breadcrumb_item">
              <span class="es-icon es-icon-booth"></span>
              <span class="label">Booths</span>
            </div>
            <span
              class="breadcrumb_separator es-icon es-icon-chevron-right"
            ></span>
            <div class="breadcrumb_item isCurrent">
              <span class="label">Creation</span>
            </div>
          </div>
        </div>

        <div
          id="formError"
          class="bulma-notification bulma-is-danger bulma-is-light"
          hidden
        >
          <button class="bulma-delete" type="button"></button>
          <div class="messages"></div>
        </div>

        <form action="" id="createForm" class="island_form">
          <div>
            <img id="picturePreview" alt="Preview" />
          </div>

          <div class="bulma-field picture">
            <label class="bulma-label" for="pictureInput">Add Picture</label>
            <input
              type="file"
              id="pictureInput"
              name="picture"
              accept="image/png,image/jpeg,image/avif,image/webp"
              required
            />
          </div>

          <div class="bulma-field name">
            <label class="bulma-label">Name</label>
            <p class="bulma-control">
              <input
                class="bulma-input"
                name="name"
                type="text"
                placeholder="Sasha Hamel"
              />
            </p>
          </div>

          <div class="bulma-field country">
            <label class="bulma-label">Country</label>
            <div class="bulma-control">
              <div class="bulma-select"></div>
            </div>
          </div>

          <div class="bulma-field location">
            <label class="bulma-label">Location</label>
            <p class="bulma-control">
              <input
                class="bulma-input"
                name="location"
                type="text"
                placeholder="Aisle A - Stand 3"
              />
            </p>
          </div>

          <div class="twoColumns">
            <div class="bulma-field startTime">
              <label class="bulma-label">Start Time</label>
              <div class="bulma-control">
                <div class="bulma-select"></div>
              </div>
            </div>

            <div class="bulma-field endTime">
              <label class="bulma-label">End Time</label>
              <div class="bulma-control">
                <div class="bulma-select"></div>
              </div>
            </div>
          </div>

          <div class="bulma-field about">
            <label class="bulma-label">About</label>
            <p class="bulma-control">
              <textarea
                class="bulma-textarea"
                placeholder="About the booth"
                name="about"
              ></textarea>
            </p>
          </div>

          <div class="bulma-field allergens">
            <label class="bulma-label">Allergens</label>
            <div class="bulma-control checkboxGrid"></div>
          </div>

          <div class="bulma-field goodToKnow">
            <label class="bulma-label">Good to Know</label>
            <div class="bulma-control checkboxColumn">
              <label class="bulma-checkbox">
                <input type="checkbox" name="isVegan" /> Vegan
              </label>
              <label class="bulma-checkbox">
                <input type="checkbox" name="isPRM" /> Person with Reduced
                Mobility
              </label>
              <label class="bulma-checkbox">
                <input type="checkbox" name="isFamilyFriendly" />
                Family-friendly
              </label>
            </div>
          </div>

          <button
            id="createButton"
            class="bulma-button bulma-is-primary"
            type="submit"
            disabled
          >
            Create
          </button>
        </form>

        <button onclick="submitForm()">Test Form</button>
      </div>
    </div>

    <script src="/scripts/routes.js"></script>
    <script src="/scripts/booths.js"></script>
    <script src="/scripts/times.js"></script>
    <script src="/scripts/allergens.js"></script>

    <script>
      renderNavBar();

      // Picture
      function setupPicture() {
        const input = document.getElementById("pictureInput");
        const preview = document.getElementById("picturePreview");
        const label = document.querySelector(
          ".bulma-field.picture .bulma-label",
        );

        input.addEventListener("change", () => {
          const file = input.files[0];

          if (!file) {
            return;
          }

          preview.src = URL.createObjectURL(file);
          preview.style.display = "block";

          label.textContent = "Update Picture";

          if (!label.classList.contains("hasPicture")) {
            label.classList.add("hasPicture");
          }
        });
      }

      setupPicture();

      // Country

      async function fillCountrySelect() {
        const countries = await getBoothCountryList();
        const countryBulmaSelect = document.querySelector(
          "#createForm .bulma-field.country .bulma-select",
        );

        countryBulmaSelect.innerHTML = "";

        const countrySelect = document.createElement("select");
        countrySelect.setAttribute("name", "country");

        for (let index = 0; index < countries.length; index++) {
          const country = countries[index];

          const option = document.createElement("option");
          option.value = country.code;
          option.textContent = country.name;

          countrySelect.appendChild(option);
        }

        countryBulmaSelect.appendChild(countrySelect);
      }

      fillCountrySelect();

      async function fillTimesOptions() {
        const times = await getTimeOptionList();

        // Start Time
        const startTimeOptionBulmaSelect = document.querySelector(
          "#createForm .bulma-field.startTime .bulma-select",
        );
        startTimeOptionBulmaSelect.innerHTML = "";

        const startTimeOptionSelect = getTimeOptionSelect(times);
        startTimeOptionSelect.setAttribute("name", "startTime");

        startTimeOptionSelect.addEventListener("input", adjustEndTime);

        startTimeOptionBulmaSelect.appendChild(startTimeOptionSelect);

        // End Time
        const endTimeOptionBulmaSelect = document.querySelector(
          "#createForm .bulma-field.endTime .bulma-select",
        );
        endTimeOptionBulmaSelect.innerHTML = "";

        const endTimeOptionSelect = getTimeOptionSelect(times);
        endTimeOptionSelect.setAttribute("name", "endTime");

        endTimeOptionSelect.addEventListener("input", adjustStartTime);

        endTimeOptionBulmaSelect.appendChild(endTimeOptionSelect);
      }

      fillTimesOptions();

      function adjustStartTime(e) {
        const startTimeOptionSelect = document.querySelector(
          "#createForm .bulma-field.startTime .bulma-select select",
        );

        if (startTimeOptionSelect.value > e.target.value) {
          startTimeOptionSelect.value = e.target.value;
        }
      }

      function adjustEndTime(e) {
        const endTimeOptionSelect = document.querySelector(
          "#createForm .bulma-field.endTime .bulma-select select",
        );

        if (endTimeOptionSelect.value < e.target.value) {
          endTimeOptionSelect.value = e.target.value;
        }
      }

      // Allergens

      async function fillAllergens() {
        const allergens = await getAllergenOptionList();

        const allergensContainer = document.querySelector(
          "#createForm .bulma-field.allergens .bulma-control",
        );

        fillAllergenOptionCheckboxesIn(allergensContainer, allergens);
      }

      fillAllergens();

      // Submit

      const FIELD_NAMES = [
        "picture",
        "name",
        "country",
        "location",
        "startTime",
        "endTime",
        "about",
        "allergens",
        "isVegan",
        "isPRM",
        "isFamilyFriendly",
      ];

      // Coupe sur ", " seulement si ce qui suit commence par un nom de champ
      const SPLIT_REGEX = new RegExp(
        `,\\s*(?=(?:${FIELD_NAMES.join("|")})\\s)`,
      );

      function splitReason(reason) {
        return reason.split(SPLIT_REGEX).map((part) => part.trim());
      }

      function showFormError(message) {
        const box = document.getElementById("formError");
        const container = box.querySelector(".messages");

        if (!message || message.trim().length < 1) {
          container.textContent = "";

          box.hidden = true;
          return;
        }

        const messages = splitReason(message);

        container.replaceChildren(
          ...messages.map((message) => {
            const line = document.createElement("div");
            line.textContent = message;
            return line;
          }),
        );

        box.hidden = false;

        box.scrollIntoView({ behavior: "smooth", block: "start" });
      }

      function clearFormError() {
        document.getElementById("formError").hidden = true;
      }

      document
        .getElementById("formError")
        .querySelector(".bulma-delete")
        .addEventListener("click", clearFormError);

      async function submitForm() {
        //(event) {
        // event.preventDefault();

        const form = document.getElementById("createForm");

        const pictureElement = form.elements.picture;
        const nameElement = form.elements.name;
        const countryElement = form.elements.country;
        const locationElement = form.elements.location;
        const startTimeElement = form.elements.startTime;
        const endTimeElement = form.elements.endTime;
        const aboutElement = form.elements.about;
        const allergensElement = form.elements.allergens;
        const isVeganElement = form.elements.isVegan;
        const isPRMElement = form.elements.isPRM;
        const isFamilyFriendlyElement = form.elements.isFamilyFriendly;

        const pictureFile = pictureElement.files[0];
        if (!pictureFile) {
          showFormError("Picture file is missing");
          return;
        }

        const body = new FormData();
        body.append("picture", pictureFile);
        body.append("name", nameElement.value);
        body.append("country", countryElement.value);
        body.append("location", locationElement.value);
        body.append("startTime", startTimeElement.value);
        body.append("endTime", endTimeElement.value);
        body.append("about", aboutElement.value);
        body.append("isVegan", isVeganElement.checked);
        body.append("isPRM", isPRMElement.checked);
        body.append("isFamilyFriendly", isFamilyFriendlyElement.checked);

        form
          .querySelectorAll('input[name="allergens"]:checked')
          .forEach((input) => body.append("allergens[]", input.value));

        const url = `http://127.0.0.1:8080/api/v0/admin/booths`;
        try {
          const response = await fetch(url, {
            method: "POST",
            body,
            headers: new Headers({
              Authorization:
                "Bearer " +
                "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWJqZWN0IjoiNUREOTg0QkEtMTFGOC00MkVCLTk5RjktRkQ3MjQ2Rjg5NzA2IiwiZXhwaXJhdGlvbiI6MTc5NTAzNjc1OS41OTA0Njd9.rDpzvmB0hm1d4mMCr8l0LG-AxssdvuhnhKzLagHPcvQ",
            }),
          });

          if (!response.ok) {
            let reason = `Erreur ${response.status}`;
            try {
              const data = await response.json();
              reason = data.reason ?? reason;
            } catch {}

            showFormError(reason);
            return;
          }

          const responseJSON = await response.json();

          console.log(responseJSON);
          // return responseJSON;
        } catch (error) {
          showFormError(error.message);

          console.error(error.message);
          return [];
        }
      }

      // Toggle disabled of createButton
      const form = document.querySelector("#createForm");

      const pictureElement = form.elements.picture;
      const nameElement = form.elements.name;
      const locationElement = form.elements.location;
      const aboutElement = form.elements.about;

      const createButton = document.querySelector("#createButton");

      function toggleCreateButtonDisabled() {
        const isEmpty =
          !pictureElement.files[0] ||
          nameElement.value.trim() === "" ||
          locationElement.value.trim() === "" ||
          aboutElement.value.trim() === "";
        createButton.disabled = isEmpty;
      }

      pictureElement.addEventListener("input", toggleCreateButtonDisabled);
      nameElement.addEventListener("input", toggleCreateButtonDisabled);
      locationElement.addEventListener("input", toggleCreateButtonDisabled);
      aboutElement.addEventListener("input", toggleCreateButtonDisabled);
    </script>
  </body>
</html>
