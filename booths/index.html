<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/styles/icons.css" />
    <link rel="stylesheet" href="/styles/app.css" />
    <title>Booths | Admin - Escale Europe</title>
  </head>
  <body>
    <div class="page bulma-container bulma-is-widescreen">
      <div class="page_header">
        <div class="siteName">
          <span class="es-icon es-icon-branch"></span>
          <div class="label">Escale Europe</div>
        </div>

        <nav id="mainNavBar"></nav>

        <button
          class="userMenu"
          type="button"
          popovertarget="userSettingsModal"
        >
          <img
            class="userMenu_photo"
            src="https://picsum.photos/seed/neko-mimi/600/300"
            alt="User Picture"
          />
          <span class="userMenu_indicator es-icon es-icon-chevron-down"></span>
        </button>

        <dialog
          id="userSettingsModal"
          class="userSettingsModal"
          closedby="any"
          popover
        >
          <div class="userSettingsModal_row nameEmail">
            <div class="name">Felipe Lebsack</div>
            <div class="email">felipe@lebsack.me</div>
          </div>
          <div class="userSettingsModal_divider"></div>
          <div class="userSettingsModal_row theme">
            <div class="label">Thème</div>
            <div class="content">Light</div>
          </div>
          <div class="userSettingsModal_divider"></div>
          <div class="userSettingsModal_row logOut">
            <span class="es-icon es-icon-log-out"></span>
            <span class="label">Log out</span>
          </div>
        </dialog>
      </div>

      <div class="page_main">
        <div class="main_header">
          <div class="breadcrumb">
            <div class="breadcrumb_item isCurrent">
              <span class="es-icon es-icon-booth"></span>
              <span class="label">Booths</span>
            </div>
          </div>

          <div class="actions">
            <a data-route="booths.create" class="bulma-button bulma-is-primary">
              <span class="bulma-icon es-icon es-icon-add-square"></span>
              <span>New booth</span>
            </a>
          </div>
        </div>

        <div id="mainTableSection">
          <div class="table_toolbar">
            <p class="bulma-control bulma-has-icons-left search">
              <input
                class="bulma-input search"
                name="search"
                type="text"
                placeholder="Search a workshop"
              />
              <span class="es-icon es-icon-search bulma-icon bulma-is-left">
              </span>
            </p>
            <div class="bulma-select">
              <select class="sortSelect">
                <option value="name">Sort by Name</option>
                <option value="location">Sort by Location</option>
                <option value="country">Sort by Country</option>
                <option value="created_at">Sort by Creation Date</option>
                <option value="updated_at">Sort by Update Date</option>
              </select>
            </div>
            <button class="bulma-button apply">Apply</button>
            <button class="bulma-button bulma-is-ghost reset">Reset</button>
          </div>
          <div class="bulma-table-container">
            <table
              id="mainDataTable"
              class="bulma-table bulma-is-fullwidth bulma-is-hoverable"
            >
              <thead>
                <tr>
                  <th></th>
                  <th>Name</th>
                  <th>Location</th>
                  <th>Country</th>
                  <th>Opening Hours</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody></tbody>
            </table>
          </div>
          <div class="table_footer">
            <div class="footer_summary"></div>
            <nav class="bulma-pagination bulma-is-small bulma-is-rounded"></nav>
          </div>
        </div>
      </div>
    </div>
    <script src="/scripts/routes.js"></script>
    <script src="/scripts/table.js"></script>
    <script src="/scripts/booths.js"></script>
    <script>
      renderNavBar();

      const itemsPerPage = 5;

      const tableToolbarApplyButton = document.querySelector(
        "#mainTableSection .table_toolbar .bulma-button.apply",
      );
      tableToolbarApplyButton.addEventListener("click", () => {
        fillTable();
      });

      const tableToolbarResetButton = document.querySelector(
        "#mainTableSection .table_toolbar .bulma-button.reset",
      );
      tableToolbarResetButton.addEventListener("click", () => {
        reset();
      });

      async function fillTable(page = 1) {
        const query = getSearchText();
        const sort = getSort();

        const result = await getBoothList(query, sort, page, itemsPerPage);

        addBoothsToTbody(result.items);

        let tableFooterSummary = document.querySelector(
          "#mainTableSection .table_footer .footer_summary",
        );
        let tablePagination = document.querySelector(
          "#mainTableSection .table_footer .bulma-pagination",
        );
        fillPagination(result, tableFooterSummary, tablePagination);
      }

      fillTable();

      function reset() {
        resetSearchText();
        resetSort();

        fillTable();
      }

      function createTrFromBooth(booth) {
        const tr = document.createElement("tr");

        const img = createTdWithImg(booth.pictureURL, `${booth.name} photo`);
        tr.appendChild(img);

        const name = createTdWithText(booth.name);
        tr.appendChild(name);

        const location = createTdWithText(booth.location);
        tr.appendChild(location);

        // Ajouter le drapeau
        const country = createTdWithText(booth.countryName);
        tr.appendChild(country);

        const openingHours = createTdWithTime(booth.startTime, booth.endTime);
        tr.appendChild(openingHours);

        const actions = createTdActions();
        tr.appendChild(actions);

        return tr;
      }

      function addBoothsToTbody(booths) {
        let tbody = document.querySelector("#mainDataTable tbody");

        tbody.innerHTML = "";

        for (let index = 0; index < booths.length; index++) {
          const booth = booths[index];

          const tr = createTrFromBooth(booth);
          tbody.appendChild(tr);
        }
      }

      function getSearchText() {
        const searchInput = document.querySelector(
          "#mainTableSection .table_toolbar .bulma-input.search",
        );

        return searchInput.value.trim();
      }

      function resetSearchText() {
        const searchInput = document.querySelector(
          "#mainTableSection .table_toolbar .bulma-input.search",
        );

        searchInput.value = "";
      }

      function getSort() {
        const sortSelect = document.querySelector(
          "#mainTableSection .table_toolbar .sortSelect",
        );

        return sortSelect.value;
      }

      function resetSort() {
        const sortSelect = document.querySelector(
          "#mainTableSection .table_toolbar .sortSelect",
        );

        sortSelect.value = "name";
      }
    </script>
  </body>
</html>
