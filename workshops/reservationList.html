<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/images/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles/Common/icons.css" />
    <link rel="stylesheet" href="/styles/app.css" />
    <link rel="stylesheet" href="/styles/Common/table.css" />
    <title>Workshop Reservations List | Admin - Escale Europe</title>
  </head>
  <body>
    <div class="page bulma-container bulma-is-widescreen">
      <div id="pageHeader" class="page_header"></div>

      <div class="page_main">
        <div class="main_header">
          <div id="mainBreadcrumb"></div>
        </div>

        <div id="mainTableSection">
          <div class="table_toolbar">
            <div class="bulma-select">
              <select class="statusFilterSelect">
                <option value="all">All status</option>
                <option value="confirmed">Confirmed</option>
                <option value="pending">Pending</option>
                <option value="cancelled">Cancelled</option>
              </select>
            </div>

            <button class="bulma-button apply">Apply</button>
            <button class="bulma-button bulma-is-ghost reset">Reset</button>
          </div>

          <div class="bulma-table-container">
            <table
              id="mainDataTable"
              class="bulma-table bulma-is-fullwidth bulma-is-hoverable"
            >
              <thead></thead>
              <tbody></tbody>
            </table>
          </div>

          <div class="table_footer">
            <div class="footer_summary"></div>
            <nav class="bulma-pagination bulma-is-small bulma-is-rounded"></nav>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="/scripts/Workshop/reservationList.js"></script>
  </body>
</html>
