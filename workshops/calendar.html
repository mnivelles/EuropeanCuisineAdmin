<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/images/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles/Common/icons.css" />
    <link rel="stylesheet" href="/styles/app.css" />
    <link rel="stylesheet" href="/styles/Workshop/calendar.css" />
    <title>Workshop Calendar | Admin - Escale Europe</title>
  </head>
  <body>
    <div id="mainCalendar">
      <div class="calendar">
        <div class="lineGrid">
          <div class="row"></div>
          <div class="row"></div>
          <div class="row"></div>
          <div class="row"></div>
          <div class="row"></div>
          <div class="row"></div>
          <div class="row"></div>
          <div class="row"></div>
          <div class="row"></div>
          <div class="row"></div>
          <div class="row"></div>
          <div class="row"></div>
        </div>
        <div class="timeline">
          <div class="empty"></div>
          <div class="time">7 AM</div>
          <div class="time">8 AM</div>
          <div class="time">9 AM</div>
          <div class="time">10 AM</div>
          <div class="time">11 AM</div>
          <div class="time">12 PM</div>
          <div class="time">1 PM</div>
          <div class="time">2 PM</div>
          <div class="time">3 PM</div>
          <div class="time">4 PM</div>
          <div class="time">5 PM</div>
          <div class="time">6 PM</div>
        </div>
        <div class="days" id="calendarDays"></div>
      </div>
    </div>

    <script type="module" src="/scripts/Workshop/calendar.js"></script>
  </body>
</html>
