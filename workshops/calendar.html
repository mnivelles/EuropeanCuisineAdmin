<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/images/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles/Common/icons.css" />
    <link rel="stylesheet" href="/styles/app.css" />
    <link rel="stylesheet" href="/styles/Workshop/calendar.css" />
    <title>Workshop Calendar | Admin - Escale Europe</title>
  </head>
  <body>
    <div class="page bulma-container bulma-is-widescreen">
      <div id="pageHeader" class="page_header"></div>

      <div class="page_main">
        <div class="main_header">
          <div id="mainBreadcrumb"></div>

          <div id="mainTabView"></div>

          <div class="actions">
            <a
              data-route="workshops.create"
              class="bulma-button bulma-is-primary"
            >
              <span class="bulma-icon es-icon es-icon-add-square"></span>
              <span>New workshop</span>
            </a>
          </div>
        </div>

        <div class="fullCalendar">
          <div id="mainCalendarHeader" class="calendarHeader">
            <div class="calendarRange"></div>

            <div class="calendarPreviousNext">
              <button class="previous" type="button">
                <span class="es-icon es-icon-chevron-left"></span>
              </button>
              <button class="next" type="button" disabled>
                <span class="es-icon es-icon-chevron-right"></span>
              </button>
            </div>
          </div>

          <div id="mainCalendar"></div>
        </div>
      </div>
    </div>

    <script type="module" src="/scripts/Workshop/calendar.js"></script>
  </body>
</html>
