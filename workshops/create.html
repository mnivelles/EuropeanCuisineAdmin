<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/styles/Common/icons.css" />
    <link rel="stylesheet" href="/styles/app.css" />
    <link rel="stylesheet" href="/styles/Common/form.css" />
    <title>Create Workshop | Admin - Escale Europe</title>
  </head>
  <body>
    <div class="page bulma-container bulma-is-widescreen">
      <div id="pageHeader" class="page_header"></div>

      <div class="page_island">
        <div class="island_header">
          <div id="mainBreadcrumb"></div>
        </div>

        <div
          id="formError"
          class="bulma-notification bulma-is-danger bulma-is-light"
          hidden
        >
          <button class="bulma-delete" type="button"></button>
          <div class="messages"></div>
        </div>

        <form action="" id="createForm" class="island_form">
          <div>
            <img id="picturePreview" alt="Preview" />
          </div>

          <div class="bulma-field picture">
            <label class="bulma-label" for="field_picture">Add Picture</label>
            <input
              type="file"
              id="field_picture"
              name="picture"
              accept="image/png,image/jpeg,image/avif,image/webp"
              required
            />
            <div id="fieldError_picture" class="fieldError" hidden></div>
          </div>

          <div class="bulma-field name">
            <label class="bulma-label" for="field_name">Name</label>
            <p class="bulma-control">
              <input
                id="field_name"
                class="bulma-input"
                name="name"
                type="text"
                placeholder="Sasha Hamel"
              />
            </p>
            <div id="fieldError_name" class="fieldError" hidden></div>
          </div>

          <div class="bulma-field category">
            <label class="bulma-label" for="field_category">Category</label>
            <div class="bulma-control">
              <div class="bulma-select">
                <select id="field_category" name="category" required>
                  <option value="" selected disabled>Select a category</option>
                </select>
              </div>
            </div>
            <div id="fieldError_category" class="fieldError" hidden></div>
          </div>

          <div class="bulma-field about">
            <label class="bulma-label" for="field_about">About</label>
            <p class="bulma-control">
              <textarea
                id="field_about"
                class="bulma-textarea"
                placeholder="About the workshop"
                name="about"
              ></textarea>
            </p>
            <div id="fieldError_about" class="fieldError" hidden></div>
          </div>

          <div class="bulma-field date">
            <label class="bulma-label" for="field_date">Date</label>
            <div class="bulma-control">
              <input
                id="field_date"
                class="bulma-input"
                type="date"
                name="date"
                placeholder="YYYY-MM-DD"
                required
              />
            </div>
            <div id="fieldError_date" class="fieldError" hidden></div>
          </div>

          <div class="twoColumns">
            <div class="bulma-field startTime">
              <label class="bulma-label">Start Time</label>
              <div class="bulma-control">
                <div class="bulma-select"></div>
              </div>
              <div id="fieldError_startTime" class="fieldError" hidden></div>
            </div>

            <div class="bulma-field endTime">
              <label class="bulma-label">End Time</label>
              <div class="bulma-control">
                <div class="bulma-select"></div>
              </div>
              <div id="fieldError_endTime" class="fieldError" hidden></div>
            </div>
          </div>

          <div class="bulma-field capacityMax">
            <label class="bulma-label" for="field_capacityMax"
              >Maximum Capacity</label
            >
            <p class="bulma-control">
              <input
                id="field_capacityMax"
                class="bulma-input"
                name="maximum-capacity"
                type="text"
                placeholder="45"
              />
            </p>
            <div id="fieldError_name" class="fieldError" hidden></div>
          </div>

          <div class="bulma-field location">
            <label class="bulma-label" for="field_location">Location</label>
            <p class="bulma-control">
              <input
                id="field_location"
                class="bulma-input"
                name="location"
                type="text"
                placeholder="Aisle A - Stand 3"
              />
            </p>
            <div id="fieldError_location" class="fieldError" hidden></div>
          </div>

          <div class="bulma-field goodToKnow">
            <label class="bulma-label">Good to Know</label>
            <div class="bulma-control checkboxColumn">
              <label class="bulma-checkbox" for="field_isVegan">
                <input id="field_isVegan" type="checkbox" name="isVegan" />
                Vegan
              </label>
              <label class="bulma-checkbox" for="field_isPRM">
                <input id="field_isPRM" type="checkbox" name="isPRM" /> Person
                with Reduced Mobility
              </label>
              <label class="bulma-checkbox" for="field_isFamilyFriendly">
                <input
                  id="field_isFamilyFriendly"
                  type="checkbox"
                  name="isFamilyFriendly"
                />
                Family-friendly
              </label>
            </div>
          </div>

          <button
            id="createButton"
            class="bulma-button bulma-is-primary"
            type="button"
          >
            Create
          </button>
        </form>
      </div>
    </div>

    <script type="module" src="/scripts/Workshop/create.js"></script>
  </body>
</html>
